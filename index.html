<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRAMUKA RPG ADVENTURE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #666;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .student {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .student h3 {
      margin: 0 0 8px;
    }

    .exp {
      font-weight: bold;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }

    .login-box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  border: 1px solid #ddd;
}

.login-box h2 {
  margin-top: 0;
  margin-bottom: 15px;
}

.login-box input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px 16px;
  margin-bottom: 12px;
  font-size: 16px;
  border: 2px solid #ddd;
  border-radius: 12px;
  background: white;
}

.login-box input:focus {
  outline: none;
  border-color: #888;
}

.login-box button {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

#loginMessage {
  margin-bottom: 0;
  font-size: 14px;
}
    
        .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #4caf50;
    }

        .class-filter {
      margin-bottom: 20px;
    }

    .class-filter select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>🏕️ PRAMUKA RPG ADVENTURE</h1>
  <p>Petualangan, EXP, Level & Gelar Pramuka</p>
</header>

<main>

  <div class="login-box" id="loginBox">
  <h2>🔐 Login Pembina</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email Pembina"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
  >

  <button id="loginButton">
    Masuk sebagai Pembina
  </button>

  <p id="loginMessage"></p>
</div>
  
  <div class="status" id="status">
    Menghubungkan ke database...
  </div>

  <div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="🔎 Cari nama siswa..."
  >
</div>

<div class="class-filter">
  <select id="classFilter">
    <option value="">📚 Semua Kelas</option>
  </select>
</div>

<div id="students"></div>

</main>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL = "https://ikzgoaixvpzntlmfctby.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_qK9jSFBBmnjEtQDRam55sg_OpVGRVb7";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  // ==========================================
// LOGIN PEMBINA
// ==========================================

const loginButton = document.getElementById("loginButton");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginMessage = document.getElementById("loginMessage");

loginButton.addEventListener("click", async () => {

  const email = loginEmail.value.trim();
  const password = loginPassword.value;

  if (!email || !password) {
    loginMessage.textContent =
      "Email dan password wajib diisi.";
    return;
  }

  loginMessage.textContent = "Memproses login...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    console.error(error);

    loginMessage.textContent =
      "Login gagal: " + error.message;

    return;
  }

  loginMessage.textContent =
    "Login berhasil. Selamat datang Pembina!";

  console.log("User login:", data.user);

});

  // ==========================================
  // MEMUAT DATA SISWA
  // ==========================================

  async function loadStudents() {

    const status = document.getElementById("status");
    const studentsContainer =
      document.getElementById("students");

    status.textContent = "Mengambil data siswa...";

    const { data, error } =
      await supabaseClient
        .from("siswa_game")
        .select("*")
        .order("nama");

    if (error) {

      console.error(error);

      status.innerHTML =
        '<span class="error">Gagal mengambil data: '
        + error.message
        + '</span>';

      return;
    }

    status.textContent =
  "Berhasil memuat " + data.length + " siswa.";

const classFilter = document.getElementById("classFilter");

const classes = [
  ...new Set(
    data
      .map(student => student.kelas)
      .filter(kelas => kelas)
  )
].sort();

classFilter.innerHTML =
  '<option value="">📚 Semua Kelas</option>';

classes.forEach(kelas => {
  const option = document.createElement("option");

  option.value = kelas;
  option.textContent = "📚 " + kelas;

  classFilter.appendChild(option);
});

    studentsContainer.innerHTML = "";

    data.forEach(student => {

      const card = document.createElement("div");

card.className = "student";
card.dataset.kelas = student.kelas || "";

card.innerHTML = `
        <h3>${student.nama}</h3>

        <div>
          ${student.kelas || ""}
          ${student.regu ? " • Regu " + student.regu : ""}
        </div>

        <p class="exp">
          ⚡ ${student.total_exp} EXP
        </p>

        <div>
          Level ${student.level} —
          ${student.gelar}
        </div>

        <div>
          Badge: ${student.badge}
        </div>
      `;

      studentsContainer.appendChild(card);

    });

    }


  const searchInput = document.getElementById("searchInput");
const classFilter = document.getElementById("classFilter");

function filterStudents() {

  const keyword =
    searchInput.value.toLowerCase();

  const selectedClass =
    classFilter.value;

  const cards =
    document.querySelectorAll(".student");

  cards.forEach(card => {

    const name =
      card.querySelector("h3")
        .textContent
        .toLowerCase();

    const studentClass =
      card.dataset.kelas || "";

    const matchName =
      name.includes(keyword);

    const matchClass =
      selectedClass === "" ||
      studentClass === selectedClass;

    if (matchName && matchClass) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }

  });
}

searchInput.addEventListener(
  "input",
  filterStudents
);

classFilter.addEventListener(
  "change",
  filterStudents
);

loadStudents();

</script>

</script>

</body>
</html>
